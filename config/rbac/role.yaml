---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - arete.arete.io
  resources:
  - backuprepositories
  - conditionalconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - arete.arete.io
  resources:
  - backuprepositories/finalizers
  - conditionalconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - arete.arete.io
  resources:
  - backuprepositories/status
  - conditionalconfigs/status
  verbs:
  - get
  - patch
  - update
