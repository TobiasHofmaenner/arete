---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: backuprepositories.arete.arete.io
spec:
  group: arete.arete.io
  names:
    kind: BackupRepository
    listKind: BackupRepositoryList
    plural: backuprepositories
    shortNames:
    - backuprepo
    - br
    singular: backuprepository
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.format
      name: Format
      type: string
    - jsonPath: .status.conditions[?(@.type=="Healthy")].status
      name: Health
      type: string
    - jsonPath: .status.conditions[?(@.type=="ProbeHealthy")].status
      name: Probe
      type: string
    - jsonPath: .status.conditions[?(@.type=="Reachable")].status
      name: Reachable
      type: string
    - jsonPath: .status.conditions[?(@.type=="BackupCurrent")].status
      name: Current
      type: string
    - jsonPath: .status.claimedLastSuccessfulBackup
      name: Last Backup
      type: date
    - jsonPath: .status.claimedLatestBackup.sizeBytes
      name: Backup Size
      type: string
    - jsonPath: .status.lastProbedAt
      name: Last Probed
      type: date
    - jsonPath: .status.conditions[?(@.type=="MetadataValid")].status
      name: E2
      type: string
    - jsonPath: .status.conditions[?(@.type=="SampledIntegrityValid")].status
      name: E3
      type: string
    - jsonPath: .status.conditions[?(@.type=="FullRetrievalCompleted")].status
      name: E4
      type: string
    - jsonPath: .status.verifiedLastValidationAt
      name: Last Validated
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.detectedVersion
      name: Detected
      priority: 1
      type: string
    - jsonPath: .status.observedInventory.objectCount
      name: Objects
      priority: 1
      type: integer
    - jsonPath: .status.observedInventory.totalBytes
      name: Total Size
      priority: 1
      type: string
    - jsonPath: .status.observedInventory.oldestObject
      name: Oldest
      priority: 1
      type: date
    - jsonPath: .status.observedInventory.newestObject
      name: Newest
      priority: 1
      type: date
    - jsonPath: .status.conditions[?(@.type=="BucketSecurityValid")].status
      name: Bucket Security
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="SizeWithinBudget")].status
      name: Budget
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="ValidationHealthy")].status
      name: Validation
      priority: 1
      type: string
    - jsonPath: .status.lastFullRetrieval.throughputBytesPerSec
      name: E4 Throughput
      priority: 1
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupRepository declares an S3-backed backup location to be continuously
          validated by the arete operator at four depth levels (E1 existence →
          E2 metadata → E3 sampled retrieval → E4 full retrieval). See ADR-022
          for the layer model and ADR-023 for arete's design.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BackupRepositorySpec defines the desired state of BackupRepository.

              All baseline fields (probe + metadata validation intervals, format,
              credentials, max backup lag) are required by design — arete enforces a
              strict contract (see ADR-023). E3 (sampled retrieval) and E4 (full
              retrieval) are opt-in by interval presence: setting the interval enables
              the level. There are no opt-out / pause / suspend / skip fields.
            properties:
              expectedSizeBudget:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  expectedSizeBudget is an optional cap on observedInventory.totalBytes.
                  When set, SizeWithinBudget condition is emitted; when exceeded,
                  SizeWithinBudget is False with reason SizeBudgetExceeded.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              format:
                description: |-
                  format is the on-disk layout of the repository. Required — auto-detection
                  is intentionally not offered (declaring intent is part of the contract).
                enum:
                - walg
                - restic
                - barman
                type: string
              fullRetrievalInterval:
                description: |-
                  fullRetrievalInterval is how often the E4 (full retrieval) performance-
                  test Job runs. Optional — setting it enables E4. Bounded to [1d, 30d]
                  when set. Can also be triggered manually via the
                  arete.arete.io/trigger-full-retrieval annotation.
                type: string
                x-kubernetes-validations:
                - message: fullRetrievalInterval must be between 1d and 30d when set
                  rule: duration(self) >= duration('24h') && duration(self) <= duration('720h')
              fullRetrievalPVCSize:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  fullRetrievalPVCSize is the size of the PVC arete provisions for the
                  E4 Job. Sized for the largest single object only (per-chunk delete keeps
                  steady-state usage at one object's worth, regardless of repo size).
                  Required iff fullRetrievalInterval is set. Bounded to [1Gi, 100Gi].
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              fullRetrievalStorageClass:
                description: |-
                  fullRetrievalStorageClass is the StorageClass arete uses for the PVC
                  that streams E4 downloads. Should match the customer's actual restore
                  storage class so the throughput metric is an honest dress rehearsal.
                  Required iff fullRetrievalInterval is set.
                minLength: 1
                type: string
              maxBackupLag:
                description: |-
                  maxBackupLag is the maximum age of the most recent successful backup
                  before BackupCurrent flips to False. Bounded to [1h, 7d].
                type: string
                x-kubernetes-validations:
                - message: maxBackupLag must be between 1h and 7d
                  rule: duration(self) >= duration('1h') && duration(self) <= duration('168h')
              metadataValidationInterval:
                description: |-
                  metadataValidationInterval is how often the E2 (format-aware metadata)
                  validation Job runs (e.g. wal-g backup-list + wal-verify, restic check).
                  Bounded to [1h, 24h].
                type: string
                x-kubernetes-validations:
                - message: metadataValidationInterval must be between 1h and 24h
                  rule: duration(self) >= duration('1h') && duration(self) <= duration('24h')
              probeInterval:
                description: |-
                  probeInterval is how often the E1 (existence) probe runs in the
                  controller process. Bounded to [1m, 1h].
                type: string
                x-kubernetes-validations:
                - message: probeInterval must be between 1m and 1h
                  rule: duration(self) >= duration('1m') && duration(self) <= duration('1h')
              s3:
                description: |-
                  s3 is the location of the repository plus declared bucket security
                  expectations.
                properties:
                  additionalSecrets:
                    description: |-
                      additionalSecrets supplies extra credential env vars sourced from
                      further Secrets — useful when format-specific encryption keys live
                      separately from the AWS auth Secret (e.g. cnpg-plugin-wal-g splits
                      nextcloud-s3 from nextcloud-walg-encryption). Each entry follows
                      the same SecretReference shape with optional keyMapping. Canonical
                      names already supplied by credentialsSecret take precedence.
                    items:
                      description: |-
                        SecretReference is a namespaced reference to a Secret, with optional
                        key remapping for Secrets whose key names don't match arete's canonical
                        AWS_* / RESTIC_PASSWORD / WALG_LIBSODIUM_KEY conventions. Lets a tenant
                        point arete at the producer's existing Secret (e.g. cnpg-plugin-wal-g's
                        nextcloud-s3 with ACCESS_KEY_ID / ACCESS_SECRET_KEY) without copying.
                      properties:
                        keyMapping:
                          additionalProperties:
                            type: string
                          description: |-
                            keyMapping renames Secret data keys for arete's use. The MAP KEY is
                            the canonical name arete (and the validator binary) expects;
                            the MAP VALUE is the actual key in the Secret.

                            Example — nextcloud-s3 has ACCESS_KEY_ID/ACCESS_SECRET_KEY:
                              keyMapping:
                                AWS_ACCESS_KEY_ID: ACCESS_KEY_ID
                                AWS_SECRET_ACCESS_KEY: ACCESS_SECRET_KEY

                            Canonical names not present in keyMapping use identity (key must
                            be the canonical name in the Secret). Unknown canonical names are
                            silently passed through with optional=true on the Job env var, so
                            missing optional creds (e.g. AWS_SESSION_TOKEN) don't fail the Job.
                          type: object
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          minLength: 1
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    type: array
                  bucket:
                    description: bucket is the S3 bucket name.
                    maxLength: 63
                    minLength: 3
                    type: string
                  credentialsSecret:
                    description: |-
                      credentialsSecret references the primary Secret with at least
                      AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (use keyMapping if your
                      Secret stores them under different names). Cluster-scoped CR
                      requires namespace.
                    properties:
                      keyMapping:
                        additionalProperties:
                          type: string
                        description: |-
                          keyMapping renames Secret data keys for arete's use. The MAP KEY is
                          the canonical name arete (and the validator binary) expects;
                          the MAP VALUE is the actual key in the Secret.

                          Example — nextcloud-s3 has ACCESS_KEY_ID/ACCESS_SECRET_KEY:
                            keyMapping:
                              AWS_ACCESS_KEY_ID: ACCESS_KEY_ID
                              AWS_SECRET_ACCESS_KEY: ACCESS_SECRET_KEY

                          Canonical names not present in keyMapping use identity (key must
                          be the canonical name in the Secret). Unknown canonical names are
                          silently passed through with optional=true on the Job env var, so
                          missing optional creds (e.g. AWS_SESSION_TOKEN) don't fail the Job.
                        type: object
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  endpoint:
                    description: |-
                      endpoint is the S3 API URL. HTTPS is mandatory (strict contract — no
                      field exists to override). Examples:
                        https://s3.eu-central-1.amazonaws.com
                        https://minio.example.internal
                    pattern: ^https://.+
                    type: string
                  extraEnv:
                    additionalProperties:
                      type: string
                    description: |-
                      extraEnv is a verbatim map of name → value env vars passed to
                      validator Job containers. Use for non-secret configuration the
                      validator binary needs that the producer also sets — e.g.
                      WALG_COMPRESSION_METHOD=lzo when cnpg-plugin-wal-g writes lzo-
                      compressed segments.
                    type: object
                  prefix:
                    description: |-
                      prefix is the key prefix that scopes this repository within the bucket.
                      Must NOT start or end with "/".
                    minLength: 1
                    pattern: ^[^/].*[^/]$|^[^/]$
                    type: string
                  region:
                    description: region is the S3 region.
                    minLength: 1
                    type: string
                  requireBucketEncryption:
                    description: |-
                      requireBucketEncryption asserts that the bucket must have server-side
                      encryption (SSE-S3 or SSE-KMS) enabled. When true, BucketSecurityValid
                      is False if the backend does not report bucket encryption configured.
                      Opt-in.
                    type: boolean
                  requireObjectLock:
                    description: |-
                      requireObjectLock asserts that the bucket must have S3 Object Lock
                      configured. When true, BucketSecurityValid is False if the backend
                      does not report Object Lock as enabled. Opt-in.
                    type: boolean
                required:
                - bucket
                - credentialsSecret
                - endpoint
                - prefix
                - region
                type: object
              sampledRetrievalInterval:
                description: |-
                  sampledRetrievalInterval is how often the E3 (sampled retrieval) Job
                  runs. Optional — setting it enables E3. Bounded to [6h, 7d] when set.
                type: string
                x-kubernetes-validations:
                - message: sampledRetrievalInterval must be between 6h and 7d when
                    set
                  rule: duration(self) >= duration('6h') && duration(self) <= duration('168h')
              sampledRetrievalObjects:
                description: |-
                  sampledRetrievalObjects is the number of objects to download per E3
                  cycle. Fixed count (NOT a percent) keeps cost scale-invariant as the
                  repo grows. Required iff sampledRetrievalInterval is set. Bounded to
                  [10, 1000].
                format: int32
                maximum: 1000
                minimum: 10
                type: integer
            required:
            - format
            - maxBackupLag
            - metadataValidationInterval
            - probeInterval
            - s3
            type: object
          status:
            description: |-
              BackupRepositoryStatus defines the observed state of BackupRepository.

              Field naming uses provenance prefixes: claimed* (producer self-reports
              parsed from sentinels — NOT verified by arete), observed* (arete
              measured directly via S3 API), verified* (arete proved via E2-E4
              validators). Conditions describe what passed and what didn't; the
              substructs hold the data behind those conditions.
            properties:
              claimedLastSuccessfulBackup:
                description: |-
                  claimedLastSuccessfulBackup is a convenience surface of
                  claimedLatestBackup.createdAt — the single most operationally
                  important field for "how long since the last backup."
                format: date-time
                type: string
              claimedLatestBackup:
                description: |-
                  claimedLatestBackup is the producer-reported metadata of the most
                  recent backup (parsed from format-specific sentinel files).
                properties:
                  createdAt:
                    description: createdAt is the FinishTime parsed from the sentinel.
                    format: date-time
                    type: string
                  name:
                    description: |-
                      name is the backup identifier as the producer wrote it (e.g. wal-g
                      BackupName, restic snapshot ID).
                    type: string
                  sizeBytes:
                    anyOf:
                    - type: integer
                    - type: string
                    description: sizeBytes is the producer-reported compressed size.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  uncompressedSizeBytes:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      uncompressedSizeBytes is the producer-reported uncompressed size, if
                      available in the sentinel.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - createdAt
                - name
                - sizeBytes
                type: object
              conditions:
                description: |-
                  conditions reflect the current state of the repository. See the
                  Condition* constants in the api package for the enumerable types.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              detectedFormat:
                description: |-
                  detectedFormat is the on-disk format inferred from sentinel files
                  in the repository. Informational.
                type: string
              detectedVersion:
                description: |-
                  detectedVersion is the producer-claimed version string parsed from
                  the sentinel (e.g. "sentinel-v2/pg-16.0.8" for wal-g). Informational
                  — the validator binary used at E2-E4 is always arete's pinned latest,
                  independent of detected version.
                type: string
              lastFullRetrieval:
                description: |-
                  lastFullRetrieval is the result of the most recent E4 Job. Stays nil
                  until E4 has been enabled and run at least once.
                properties:
                  bytesTransferred:
                    description: bytesTransferred is the cumulative bytes read across
                      all objects.
                    format: int64
                    type: integer
                  completedAt:
                    description: completedAt is when the E4 Job finished (regardless
                      of success).
                    format: date-time
                    type: string
                  durationSeconds:
                    description: durationSeconds is total wall time for the retrieval.
                    format: int64
                    type: integer
                  failedObjects:
                    description: failedObjects is the number of GETs that errored
                      mid-stream.
                    format: int64
                    type: integer
                  objectsRetrieved:
                    description: objectsRetrieved is the number of S3 objects successfully
                      fetched.
                    format: int64
                    type: integer
                  throughputBytesPerSec:
                    description: |-
                      throughputBytesPerSec is bytesTransferred / durationSeconds —
                      includes Ceph RBD write overhead because the PVC writes are real.
                      Plug this into RTO calculations.
                    format: int64
                    type: integer
                  triggerSource:
                    description: triggerSource records who started this run.
                    enum:
                    - scheduled
                    - manual
                    type: string
                required:
                - bytesTransferred
                - completedAt
                - durationSeconds
                - failedObjects
                - objectsRetrieved
                - throughputBytesPerSec
                - triggerSource
                type: object
              lastProbedAt:
                description: lastProbedAt is when the most recent E1 probe completed.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              observedGrowth:
                description: |-
                  observedGrowth is arete's measurement of inventory growth over a
                  rolling window. Stays nil until 3-growth ships.
                properties:
                  bytes:
                    anyOf:
                    - type: integer
                    - type: string
                    description: bytes is the increase in observedInventory.totalBytes
                      over the window.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  sampledAt:
                    description: sampledAt is when the growth measurement completed.
                    format: date-time
                    type: string
                  window:
                    description: window is the time span this delta covers (e.g. 7d).
                    type: string
                required:
                - bytes
                - sampledAt
                - window
                type: object
              observedInventory:
                description: |-
                  observedInventory is arete's direct measurement of repository contents
                  (from S3 LIST). Recomputed at metadataValidationInterval cadence
                  (cheaper than per-probe). Stays nil until 3-inventory ships.
                properties:
                  newestObject:
                    description: newestObject is the LastModified of the latest object.
                    format: date-time
                    type: string
                  objectCount:
                    description: objectCount is the total number of S3 objects under
                      spec.s3.prefix.
                    format: int64
                    type: integer
                  oldestObject:
                    description: oldestObject is the LastModified of the earliest
                      object.
                    format: date-time
                    type: string
                  totalBytes:
                    anyOf:
                    - type: integer
                    - type: string
                    description: totalBytes is the cumulative size of all objects.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - objectCount
                - totalBytes
                type: object
              verifiedLastSampledRetrievalAt:
                description: |-
                  verifiedLastSampledRetrievalAt is when the most recent E3 sampled
                  retrieval Job completed (success or failure — separate condition
                  SampledIntegrityValid carries the outcome).
                format: date-time
                type: string
              verifiedLastValidationAt:
                description: |-
                  verifiedLastValidationAt is when the most recent successful E2 run
                  completed.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
