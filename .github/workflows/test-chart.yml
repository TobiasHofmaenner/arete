name: Test Chart

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind
  KIND_VERSION: v0.33.0
  # Same major as the Helm library inside Flux's helm-controller, which installs this chart.
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.2

jobs:
  test-chart:
    name: chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare arete
        run: |
          make docker-build IMG=arete:v0.1.0
          kind load docker-image arete:v0.1.0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Verify Helm installation
        run: helm version

      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart

      - name: Install Helm chart for project
        run: |
          helm install my-release ./dist/chart --create-namespace --namespace arete-system

      - name: Check Helm release status
        run: |
          helm status my-release --namespace arete-system
