name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Fail instead of silently fixing: go.mod and go.sum must be committed tidy.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Run tests
        run: make test

      - name: Regenerate the chart's CRDs
        run: make chart-crds

      # make test regenerates CRDs, RBAC and deepcopy code, and make chart-crds
      # copies the CRDs into the Helm chart. A difference here means generated
      # files were not committed with the change that needs them. The chart's
      # CRD once missed a field this way, which made the feature unusable.
      - name: Check generated files are committed
        run: git diff --exit-code
