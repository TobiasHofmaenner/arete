# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      # Default repository — overridable. CI builds + pushes here on tag.
      repository: ghcr.io/tobiashofmaenner/arete
      # Tag falls back to .Chart.AppVersion if empty (see deployment template)
      tag: ""
    imagePullPolicy: IfNotPresent
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: arete-controller-manager

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false
  # rules: install the bundled PrometheusRule with arete-specific alerts.
  # Independent of the ServiceMonitor — you can scrape via your own
  # ServiceMonitor while still consuming the canned alerts.
  rules:
    enable: false
    # additionalLabels lets the rules satisfy your Prometheus operator's
    # ruleSelector. kube-prometheus-stack defaults to release=<name>.
    additionalLabels: {}

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: false

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# BackupRepositoryConditional materializes arbitrary K8s resources
# (cnpg Clusters, Helm releases, Jobs, etc.) based on backup-repo
# state. The controller needs cluster-wide write permissions on every
# GVK its variants reference. List those here so the chart's
# ClusterRole grants matching rules; users with more variant kinds
# extend this list.
backupRepositoryConditional:
  childResourceTargets:
    - apiGroups: ["postgresql.cnpg.io"]
      resources: ["clusters"]

# [VALIDATOR IMAGES]: Per-format images the controller spawns as Jobs for
# E2 metadata validation, E3 sampled retrieval, and E4 full retrieval.
#
# Per ADR-023's strict-contract / always-latest-pinned strategy, these are
# pinned per arete release (via the chart) — customers don't override them.
# Bumping arete bumps the validators, which doubles as a forward-compat
# canary for producer upgrades.
#
# wal-g: image built by arete CI alongside the controller (no official
#        upstream Docker image exists). Tag falls back to .Chart.AppVersion.
# restic: pinned to upstream restic/restic image.
validatorImages:
  walg:
    repository: ghcr.io/tobiashofmaenner/arete-validator-walg
    tag: ""  # empty → defaults to .Chart.AppVersion (matches arete release)
  restic:
    repository: restic/restic
    tag: "0.18.1"  # pinned upstream
