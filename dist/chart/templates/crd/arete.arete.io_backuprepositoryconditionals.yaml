{{- if .Values.crd.enable }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.20.1
  name: backuprepositoryconditionals.arete.arete.io
spec:
  group: arete.arete.io
  names:
    kind: BackupRepositoryConditional
    listKind: BackupRepositoryConditionalList
    plural: backuprepositoryconditionals
    shortNames:
    - brc
    singular: backuprepositoryconditional
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repositoryRef.name
      name: Repository
      type: string
    - jsonPath: .status.observedRepositoryState
      name: State
      type: string
    - jsonPath: .status.decided
      name: Decided
      type: string
    - jsonPath: .status.appliedRef.kind
      name: Applied Kind
      type: string
    - jsonPath: .status.appliedRef.name
      name: Applied Name
      type: string
    - jsonPath: .status.decidedAt
      name: Last Decided
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BackupRepositoryConditional materializes one of three variant
          manifests based on the live state of a referenced BackupRepository.
          See ADR-023 for the bootstrap-mode-style use case (cnpg recovery vs
          initdb).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state.
            properties:
              repositoryRef:
                description: |-
                  repositoryRef points to the cluster-scoped BackupRepository whose
                  state drives the variant selection.
                properties:
                  name:
                    description: name is the BackupRepository's metadata.name.
                    type: string
                required:
                - name
                type: object
              whenDegraded:
                description: |-
                  whenDegraded is the variant materialized when the BR is neither
                  Healthy nor Empty (in-flight, broken, never-validated).
                  Typically left nil to refuse to materialize anything in uncertain
                  states — better to block deployment than to silently apply the
                  wrong manifest.
                properties:
                  manifestRef:
                    description: |-
                      manifestRef points at a ConfigMap or Secret whose data[<key>] holds
                      the full manifest YAML to apply. Exactly one of configMap / secret
                      must be set.
                    properties:
                      configMap:
                        description: |-
                          configMap holds the manifest as plain text. Pair with
                          `kustomize configMapGenerator` to author the source as a normal
                          .yaml file with full IDE schema validation.
                        properties:
                          key:
                            description: key is the data[<key>] entry holding the
                              manifest YAML.
                            type: string
                          name:
                            description: |-
                              name is the ConfigMap's name (same namespace as the
                              BackupRepositoryConditional).
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      secret:
                        description: |-
                          secret holds the manifest in a Secret data key. Use when the
                          manifest itself contains sensitive material (inline credentials,
                          pre-shared keys, etc.) and you don't want it readable to anyone
                          with ConfigMap access.
                        properties:
                          key:
                            description: key is the data[<key>] entry holding the
                              manifest YAML.
                            type: string
                          name:
                            description: |-
                              name is the Secret's name (same namespace as the
                              BackupRepositoryConditional).
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                required:
                - manifestRef
                type: object
              whenEmpty:
                description: |-
                  whenEmpty is the variant materialized when the BR has no successful
                  backups recorded (claimedLastSuccessfulBackup is nil OR
                  observedInventory.objectCount == 0). Typical use: an initdb-mode
                  fresh-bootstrap manifest.
                  If nil, no resource is applied in this state.
                properties:
                  manifestRef:
                    description: |-
                      manifestRef points at a ConfigMap or Secret whose data[<key>] holds
                      the full manifest YAML to apply. Exactly one of configMap / secret
                      must be set.
                    properties:
                      configMap:
                        description: |-
                          configMap holds the manifest as plain text. Pair with
                          `kustomize configMapGenerator` to author the source as a normal
                          .yaml file with full IDE schema validation.
                        properties:
                          key:
                            description: key is the data[<key>] entry holding the
                              manifest YAML.
                            type: string
                          name:
                            description: |-
                              name is the ConfigMap's name (same namespace as the
                              BackupRepositoryConditional).
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      secret:
                        description: |-
                          secret holds the manifest in a Secret data key. Use when the
                          manifest itself contains sensitive material (inline credentials,
                          pre-shared keys, etc.) and you don't want it readable to anyone
                          with ConfigMap access.
                        properties:
                          key:
                            description: key is the data[<key>] entry holding the
                              manifest YAML.
                            type: string
                          name:
                            description: |-
                              name is the Secret's name (same namespace as the
                              BackupRepositoryConditional).
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                required:
                - manifestRef
                type: object
              whenHealthy:
                description: |-
                  whenHealthy is the variant materialized when BR.Healthy=True.
                  If nil, no resource is applied in this state.
                properties:
                  manifestRef:
                    description: |-
                      manifestRef points at a ConfigMap or Secret whose data[<key>] holds
                      the full manifest YAML to apply. Exactly one of configMap / secret
                      must be set.
                    properties:
                      configMap:
                        description: |-
                          configMap holds the manifest as plain text. Pair with
                          `kustomize configMapGenerator` to author the source as a normal
                          .yaml file with full IDE schema validation.
                        properties:
                          key:
                            description: key is the data[<key>] entry holding the
                              manifest YAML.
                            type: string
                          name:
                            description: |-
                              name is the ConfigMap's name (same namespace as the
                              BackupRepositoryConditional).
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      secret:
                        description: |-
                          secret holds the manifest in a Secret data key. Use when the
                          manifest itself contains sensitive material (inline credentials,
                          pre-shared keys, etc.) and you don't want it readable to anyone
                          with ConfigMap access.
                        properties:
                          key:
                            description: key is the data[<key>] entry holding the
                              manifest YAML.
                            type: string
                          name:
                            description: |-
                              name is the Secret's name (same namespace as the
                              BackupRepositoryConditional).
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                required:
                - manifestRef
                type: object
            required:
            - repositoryRef
            type: object
          status:
            description: status is the observed state.
            properties:
              appliedRef:
                description: |-
                  appliedRef is the last resource the controller successfully
                  applied. nil until the first apply succeeds.
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              conditions:
                description: |-
                  conditions report observability state. Standard types:
                    - BackupRepositoryFound: the spec.repositoryRef resolves
                    - ManifestSourceFound:   the chosen variant's ConfigMap/Secret exists
                    - ManifestParsed:        the YAML deserialized into a valid object
                    - ChildApplied:          server-side apply succeeded
                    - Decided (rollup):      a variant was applied (or refused intentionally)
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              decided:
                description: |-
                  decided is the variant slot that was applied: "whenHealthy" |
                  "whenEmpty" | "whenDegraded" | "" (no decision made yet).
                type: string
              decidedAt:
                description: |-
                  decidedAt is the timestamp of the most recent successful
                  materialization.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the .metadata.generation this status
                  reflects.
                format: int64
                type: integer
              observedRepositoryState:
                description: |-
                  observedRepositoryState records which slot the controller picked
                  during the most recent reconcile: "healthy" | "empty" | "degraded"
                  | "" (no decision made yet).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end -}}
