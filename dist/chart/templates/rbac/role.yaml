{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: arete-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - arete.arete.io
  resources:
  - backuprepositories
  - backuprepositoryconditionals
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - arete.arete.io
  resources:
  - backuprepositories/finalizers
  - backuprepositoryconditionals/finalizers
  verbs:
  - update
- apiGroups:
  - arete.arete.io
  resources:
  - backuprepositories/status
  - backuprepositoryconditionals/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
{{- /*
  childResourceTargets: list of GVK rules granting the controller
  permission to materialize child manifests via
  BackupRepositoryConditional. Each entry is a ClusterRole rule
  (apiGroups + resources). Defaults to cnpg Cluster — the only
  target type used today. Extend in chart values when adding new
  variant kinds.
*/ -}}
{{- range .Values.backupRepositoryConditional.childResourceTargets }}
- apiGroups:
{{ toYaml .apiGroups | indent 2 }}
  resources:
{{ toYaml .resources | indent 2 }}
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- end }}
{{- end -}}
