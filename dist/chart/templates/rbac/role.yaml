{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: arete-manager-role
rules:
- apiGroups:
  - arete.arete.io
  resources:
  - backuprepositories
  - conditionalconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - arete.arete.io
  resources:
  - backuprepositories/finalizers
  - conditionalconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - arete.arete.io
  resources:
  - backuprepositories/status
  - conditionalconfigs/status
  verbs:
  - get
  - patch
  - update
{{- end -}}
